<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#E0E7FF"/></radialGradient>
    <linearGradient id="ringTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F87171"/><stop offset="1" stop-color="#B91C1C"/></linearGradient>
    <linearGradient id="ringSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#991B1B"/><stop offset="1" stop-color="#7F1D1D"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D4D4D8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg)"/>
  <!-- shadow -->
  <ellipse cx="300" cy="320" rx="170" ry="34" fill="#312E81" opacity="0.22" filter="url(#sh)"/>
  <!-- ring as tilted 3D torus: side then top -->
  <g transform="translate(300 200) scale(1 0.62)">
    <circle r="150" fill="none" stroke="#A1A1AA" stroke-width="44" transform="translate(0 34)"/>
    <circle r="150" fill="none" stroke="url(#ringSide)" stroke-width="44" stroke-dasharray="500 943" transform="translate(0 34) rotate(-90)"/>
    <circle r="150" fill="none" stroke="url(#track)" stroke-width="44"/>
    <circle r="150" fill="none" stroke="url(#ringTop)" stroke-width="44" stroke-dasharray="500 943" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="150" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5" transform="translate(0 -14)"/>
  </g>
  <text x="300" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#18181B" letter-spacing="-3">53</text>
  <text x="300" y="244" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#52525B">/ 100</text>
  <!-- deduction chips -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="500">
    <rect x="34" y="40" width="72" height="30" rx="15" fill="#DC2626"/><text x="70" y="60" text-anchor="middle" fill="#FFFFFF">−25</text>
    <rect x="494" y="56" width="72" height="30" rx="15" fill="#C2410C"/><text x="530" y="76" text-anchor="middle" fill="#FFFFFF">−10</text>
    <rect x="504" y="300" width="72" height="30" rx="15" fill="#C2410C"/><text x="540" y="320" text-anchor="middle" fill="#FFFFFF">−10</text>
    <rect x="24" y="310" width="72" height="30" rx="15" fill="#A16207"/><text x="60" y="330" text-anchor="middle" fill="#FFFFFF">−1.8</text>
  </g>
</svg>
