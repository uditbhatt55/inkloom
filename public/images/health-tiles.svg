<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F3FF"/><stop offset="1" stop-color="#ECFEFF"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.16"/></filter>
