      <rect x="14" y="40" width="70" height="10" rx="5" fill="#F87171"/>
    </g>
    <circle cx="107" cy="128" r="16" fill="#18181B"/>
    <text x="107" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">≠</text>
  </g>

