    <text x="20" y="36" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181B">Unclear rules</text>
    <path d="M37 170 A 70 70 0 0 1 177 170" fill="none" stroke="#F4F4F5" stroke-width="22" stroke-linecap="round"/>
    <path d="M37 170 A 70 70 0 0 1 150 115" fill="none" stroke="#D97706" stroke-width="22" stroke-linecap="round"/>
    <text x="107" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#18181B">62%</text>
    <text x="107" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#52525B">overruled</text>
  </g>

  <!-- tile 3: conflicting rules -->
  <g transform="translate(516 56)" filter="url(#sh)">
