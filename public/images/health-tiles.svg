      <rect x="20" y="112" width="174" height="40" rx="10" fill="#FAFAFA"/><rect x="32" y="126" width="60" height="10" rx="5" fill="#A1A1AA"/><rect x="112" y="122" width="72" height="20" rx="10" fill="#FEF3C7"/><text x="148" y="136" text-anchor="middle" fill="#92400E">Expires soon</text>
