    </g>
    <g transform="translate(78 196)">
      <path d="M0 0 v-84 l14 -8 v84 z" fill="#3730A3"/><rect x="-24" y="-84" width="24" height="84" fill="url(#bar)"/><path d="M-24 -84 l14 -8 h24 l-14 8 z" fill="#A5B4FC"/>
    </g>
    <g transform="translate(128 196)">
