    </g>
    <g transform="translate(178 196)">
      <path d="M0 0 v-30 l14 -8 v30 z" fill="#3730A3"/><rect x="-24" y="-30" width="24" height="30" fill="url(#bar)"/><path d="M-24 -30 l14 -8 h24 l-14 8 z" fill="#A5B4FC"/>
    </g>
